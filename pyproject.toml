[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bahamas"
version = "0.1.2"
description = "BAyesian HAmiltonian Montecarlo Analysis for Stochastic gravitational wave signal"
readme = "README.md"
requires-python = ">=3.10,<3.14"   # 3.14+: no NumPy < 2.4 wheels for older Linux (see [tool.uv] below)
license = { text = "Apache License 2.0" }

authors = [
  { name = "Federico Pozzoli", email = "fpozzoli@uninsubria.it" },
  { name = "Riccardo Buscicchio", email = "riccardo.buscicchio@unimib.it" }
]

maintainers = [
  { name = "Federico Pozzoli", email = "fpozzoli@uninsubria.it" },
  { name = "Riccardo Buscicchio", email = "riccardo.buscicchio@unimib.it" }
]

classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent"
]

dependencies = [
  "numpy<2.4",   # eryn 1.2.6 calls np.in1d and np.trapz, removed in NumPy 2.4
  "jax",
  "jaxlib",
  "numpyro",
  "scipy",
  "matplotlib",
  "h5py",
  "pyyaml",
  "nessai",
  "healpy",
  "scikit-image",
  "corner",
  "eryn"
]

[project.optional-dependencies]
test = [
  "pytest",
  "pywavelet"
]

[project.urls]
Homepage = "https://github.com/FedericoPozzoli/bahamas"
Repository = "https://github.com/FedericoPozzoli/bahamas.git"
Issues = "https://github.com/FedericoPozzoli/bahamas/issues"

[project.scripts]
bahamas-inference = "bahamas.utilities.run_pe:main"
bahamas-data = "bahamas.utilities.run_data:main"
bahamas-input = "bahamas.utilities.run_input:main"
bahamas-bpls = "bahamas.utilities.run_bpls:main"

[tool.setuptools]
package-dir = {"" = "."}
packages = [
  "bahamas",
  "bahamas.psd_strain",
  "bahamas.psd_response",
  "bahamas.method",
  "bahamas.utilities",
  "bahamas.wavelet"
]

[tool.uv]
# Keep uv.lock installable from prebuilt wheels on clusters with an old glibc (down to 2.17, manylinux2014):
# newer releases of these ship Linux wheels only for glibc >= 2.27/2.28, and uv then tries (and fails) to compile
# them there. Each cap is the newest release with a manylinux2014 wheel. The `test` extra is not covered.
# Check after every `uv lock`: simulations/common/check_lock_wheels.sh
constraint-dependencies = [
  "torch<=2.6.0",          # via nessai/glasflow
  "jax<=0.7.0",
  "jaxlib<=0.7.0",
  "ml-dtypes<=0.5.1",      # via jax
  "scipy<=1.16.3",
  "h5py<=3.14.0",
  "healpy<=1.19.0",
  "scikit-image<=0.25.2",
  "contourpy<=1.3.2",      # via matplotlib
  "pillow<=12.2.0",        # via matplotlib
  "pandas<=2.3.2",         # via nessai
]

[tool.setuptools.package-data]
"bahamas" = ["../template/*.yaml", "../docs/_static/*"]
