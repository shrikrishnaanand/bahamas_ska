# Laptop-sized version of config_wavelet.yaml (minutes, not hours).
# One year sampled every 1000 s and analysed in [1e-4, 4.9e-4] Hz, where the
# galactic foreground dominates. Use it to check the pipeline end to end.

domain: 'wavelet'

T: 31557600.0
dt: 1000
gen2: True
t0: 0

f1: 0.0001
f2: 0.00049

folder_plot: '../data/'

wavelet:
  Nf: 64
  nx: 4.0
  channels: [0, 1]
  seed: 42
  file: '../data/data_wavelet_quick'
  freq_bins: null
  edge_bins: 4
  time_bin: 1
  band_samples: 8

inference:
  sampler: 'eryn'
  modulation: 'wavelets'
  wavelet_shape: 'gaussian'
  min_wavelets: 0
  max_wavelets: 12
  width_range_days: [5, 180]
  amp_range: [-3, 3]
  level_range: [-2, 2]
  atom_step: 0.02
  nwalkers: 32
  ntemps: 2
  nsteps: 600
  burnin: 300
  thin: 1
  init: 'injected'
  seed: 1
  file: '../data/data_wavelet_quick'
  file_post: '../data/result_wavelet_quick.npz'
